services:
  - type: web
    name: fashionpur-identity-staging
    runtime: node
    region: singapore
    plan: starter
    branch: codex/phase-1-foundation
    rootDir: shopify-app/fashionpur-identity
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        value: https://account-staging.fashionpur.com
      - key: SCOPES
        value: read_customers,write_customers,read_orders,write_app_proxy
      - key: CUSTOMER_ACCOUNT_URL
        value: https://account-staging.fashionpur.com
      - key: STOREFRONT_ORIGIN
        value: https://www.fashionpur.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OTP_PROVIDER
        value: msg91
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
