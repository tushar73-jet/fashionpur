# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "8b8e65384da15fca171a51660a5b0084"
name = "fashionpur-identity"
application_url = "https://fashionpur.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = [ "orders/updated" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Customer/order access is only for verified-profile linkage and that
# customer's own order history. Shopify may require protected-data approval.
scopes = "read_customers,write_customers,read_orders,write_app_proxy"

[auth]
redirect_urls = [ "https://fashionpur.onrender.com/auth/callback" ]

[app_proxy]
url = "/proxy"
subpath = "fashionpur-identity"
prefix = "apps"
